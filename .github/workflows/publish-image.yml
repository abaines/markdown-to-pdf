name: Publish image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to GHCR. Leave off for a dry run.
        type: boolean
        default: false

run-name: ${{ inputs.publish && 'Publish image' || 'Dry run' }}

permissions: {}

env:
  # A new tag per attempt, so a published tag never moves. Consumers pin the digest.
  IMAGE_REF: ghcr.io/abaines/markdown-to-pdf:${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}

jobs:
  # Builds and tests the image without any write access, in both modes.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_URL: https://github.com/abaines/markdown-to-pdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.source=$SOURCE_URL" --tag "$IMAGE_REF" .

      # Published versions are never deleted, so a bad image must stop here.
      - name: Render and check
        run: sh scripts/render-check.sh docker "$IMAGE_REF"

      - name: Upload render
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-from-new-image
          path: generated

      # Hands the tested image to the push job, so it pushes exactly what was checked.
      # Dry runs upload it too, so they rehearse the hand-off
      # and leave an image you can load locally.
      - name: Save image
        run: docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE_REF"

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 2

  # The only job with write access. It runs no code from the repository,
  # and the environment only allows main and asks for approval.
  push:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: GitHubContainerRegistry
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "$RUNNER_TEMP/image.tar"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: docker push "$IMAGE_REF"

      - name: Print digest
        run: |
          digest_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")"
          docker pull "$digest_ref"
          echo "$digest_ref" | tee -a "$GITHUB_STEP_SUMMARY"

  # Runs the action as users do, with the image action.yml pins now.
  test-usage:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          input_path: README.md
          output_dir: generated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-from-pinned-image
          path: generated
